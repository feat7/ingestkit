version: "1.0"

events:
  article_viewed:
    description: Fired when a user views a blog article
    fields:
      user_id:
        type: string
        required: false
        indexed: true
        description: User ID if logged in, null for anonymous
      session_id:
        type: string
        required: true
        indexed: true
        description: Session identifier
      article_id:
        type: string
        required: true
        indexed: true
        description: Unique article identifier (slug)
      article_title:
        type: string
        required: true
        description: Article title
      author:
        type: string
        required: true
        indexed: true
        description: Article author
      category:
        type: string
        required: true
        indexed: true
        description: Article category
      tags:
        type: jsonb
        required: false
        description: Array of article tags
      read_time_seconds:
        type: integer
        required: false
        description: Estimated time to read article
      source:
        type: string
        required: false
        indexed: true
        description: Traffic source (direct, search, social, email)
      referrer:
        type: string
        required: false
        description: HTTP referrer
      metadata:
        type: jsonb
        required: false

  article_shared:
    description: Fired when a user shares an article
    fields:
      user_id:
        type: string
        required: false
        indexed: true
      session_id:
        type: string
        required: true
        indexed: true
      article_id:
        type: string
        required: true
        indexed: true
      article_title:
        type: string
        required: true
      platform:
        type: string
        required: true
        indexed: true
        description: Sharing platform (twitter, facebook, linkedin, email)
      metadata:
        type: jsonb
        required: false

  comment_posted:
    description: Fired when a user posts a comment
    fields:
      user_id:
        type: string
        required: true
        indexed: true
      session_id:
        type: string
        required: true
        indexed: true
      article_id:
        type: string
        required: true
        indexed: true
      comment_id:
        type: string
        required: true
        indexed: true
        description: Unique comment identifier
      parent_comment_id:
        type: string
        required: false
        indexed: true
        description: Parent comment ID if this is a reply
      comment_length:
        type: integer
        required: true
        description: Number of characters in comment
      metadata:
        type: jsonb
        required: false

  newsletter_subscribed:
    description: Fired when a user subscribes to newsletter
    fields:
      user_id:
        type: string
        required: false
        indexed: true
      session_id:
        type: string
        required: true
        indexed: true
      email:
        type: string
        required: true
        indexed: true
        description: Subscriber email address
      subscription_type:
        type: string
        required: true
        indexed: true
        description: Type of subscription (weekly, daily, instant)
      source:
        type: string
        required: false
        indexed: true
        description: Where subscription happened (article, homepage, popup)
      metadata:
        type: jsonb
        required: false

  search_performed:
    description: Fired when a user searches for content
    fields:
      user_id:
        type: string
        required: false
        indexed: true
      session_id:
        type: string
        required: true
        indexed: true
      query:
        type: string
        required: true
        indexed: true
        description: Search query text
      results_count:
        type: integer
        required: true
        description: Number of results returned
      clicked_result_id:
        type: string
        required: false
        indexed: true
        description: Article ID if user clicked a result
      metadata:
        type: jsonb
        required: false
