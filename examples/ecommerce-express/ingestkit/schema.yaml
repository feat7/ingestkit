version: "1.0"

events:
  product_viewed:
    description: Fired when a user views a product page
    fields:
      user_id:
        type: string
        required: true
        indexed: true
        description: Unique identifier for the user
      session_id:
        type: string
        required: true
        indexed: true
        description: Session identifier
      product_id:
        type: string
        required: true
        indexed: true
        description: Product SKU or ID
      product_name:
        type: string
        required: true
        description: Name of the product
      product_category:
        type: string
        required: true
        indexed: true
        description: Product category
      price:
        type: decimal
        required: true
        description: Product price
      currency:
        type: string
        required: true
        default: "USD"
        description: Currency code
      source:
        type: string
        required: false
        indexed: true
        description: Traffic source (search, category, recommendation)
      metadata:
        type: jsonb
        required: false
        description: Additional product or context data

  added_to_cart:
    description: Fired when a user adds an item to cart
    fields:
      user_id:
        type: string
        required: true
        indexed: true
      session_id:
        type: string
        required: true
        indexed: true
      product_id:
        type: string
        required: true
        indexed: true
      product_name:
        type: string
        required: true
      quantity:
        type: integer
        required: true
        description: Number of items added
      price:
        type: decimal
        required: true
      currency:
        type: string
        required: true
        default: "USD"
      cart_total:
        type: decimal
        required: false
        description: Total cart value after adding item
      metadata:
        type: jsonb
        required: false

  checkout_started:
    description: Fired when a user begins checkout process
    fields:
      user_id:
        type: string
        required: true
        indexed: true
      session_id:
        type: string
        required: true
        indexed: true
      cart_id:
        type: string
        required: true
        indexed: true
        description: Unique cart identifier
      num_items:
        type: integer
        required: true
        description: Number of items in cart
      cart_total:
        type: decimal
        required: true
        description: Total cart value
      currency:
        type: string
        required: true
        default: "USD"
      items:
        type: jsonb
        required: true
        description: Array of cart items with details
      metadata:
        type: jsonb
        required: false

  order_completed:
    description: Fired when an order is successfully placed
    fields:
      user_id:
        type: string
        required: true
        indexed: true
      session_id:
        type: string
        required: true
        indexed: true
      order_id:
        type: string
        required: true
        indexed: true
        description: Unique order identifier
      cart_id:
        type: string
        required: false
        indexed: true
      total_amount:
        type: decimal
        required: true
        description: Total order amount
      currency:
        type: string
        required: true
        default: "USD"
      payment_method:
        type: string
        required: true
        description: Payment method used
      num_items:
        type: integer
        required: true
      shipping_address:
        type: jsonb
        required: true
        description: Shipping address details
      items:
        type: jsonb
        required: true
        description: Ordered items with details
      discount_code:
        type: string
        required: false
        description: Applied discount code
      discount_amount:
        type: decimal
        required: false
        description: Discount amount applied
      metadata:
        type: jsonb
        required: false
