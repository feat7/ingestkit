# IngestKit Server Infrastructure
# Generated by: ingestkit init --server
# Docs: https://github.com/feat7/ingestkit

services:
  # PostgreSQL - Primary storage
  postgres:
    image: postgres:16-alpine
    container_name: ingestkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ingestkit}
      POSTGRES_USER: ${POSTGRES_USER:-ingestkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ingestkit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ingestkit

  # Redpanda - Message broker (Kafka-compatible)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: ingestkit-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --overprovisioned
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ingestkit

  # IngestKit API Server
  api:
    image: ghcr.io/feat7/ingestkit/api:${INGESTKIT_VERSION:-latest}
    container_name: ingestkit-api
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8080}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY_1: ${API_KEY_1:-dev_key_1234567890:default}
      API_KEY_2: ${API_KEY_2:-}
      API_KEY_3: ${API_KEY_3:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ingestkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ingestkit}
      REDPANDA_ADDR: redpanda:9092
      REDPANDA_TOPIC: ${REDPANDA_TOPIC:-ingestkit.events}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ingestkit

  # IngestKit Consumer Worker
  consumer:
    image: ghcr.io/feat7/ingestkit/consumer:${INGESTKIT_VERSION:-latest}
    container_name: ingestkit-consumer
    restart: unless-stopped
    environment:
      CONSUMER_WORKERS: ${CONSUMER_WORKERS:-4}
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-500}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-ingestkit}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-ingestkit}
      REDPANDA_ADDR: redpanda:9092
      REDPANDA_TOPIC: ${REDPANDA_TOPIC:-ingestkit.events}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID:-ingestkit-consumer}
      METRICS_PORT: ${METRICS_PORT:-8081}
    ports:
      - "${METRICS_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - ingestkit

volumes:
  postgres_data:
    driver: local
  redpanda_data:
    driver: local

networks:
  ingestkit:
    driver: bridge
