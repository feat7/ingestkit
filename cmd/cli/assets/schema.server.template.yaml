# IngestKit Event Schema
# Generated by: ingestkit init --server
# Docs: https://github.com/feat7/ingestkit

version: "1.0"
namespace: events

# Define your events below. Each event becomes a table in PostgreSQL
# and generates type-safe SDK methods.

events:
  # Example: User signup event
  user_signup:
    description: "Tracks when a new user signs up"
    fields:
      - name: user_id
        type: string
        required: true
        description: "Unique user identifier"
      - name: email
        type: string
        required: true
        description: "User email address"
      - name: signup_source
        type: string
        required: false
        description: "Where the user signed up from (web, mobile, api)"
      - name: referrer
        type: string
        required: false
        description: "Referral source"
      - name: metadata
        type: jsonb
        required: false
        description: "Additional signup data"

  # Example: Page view event
  page_view:
    description: "Tracks page views"
    fields:
      - name: user_id
        type: string
        required: false
        description: "User ID (if logged in)"
      - name: session_id
        type: string
        required: true
        description: "Session identifier"
      - name: page_url
        type: string
        required: true
        description: "URL of the viewed page"
      - name: page_title
        type: string
        required: false
        description: "Title of the page"
      - name: referrer
        type: string
        required: false
        description: "Referring URL"
      - name: duration_seconds
        type: integer
        required: false
        description: "Time spent on page"

# Add more events as needed. After editing, run:
#   ingestkit schema apply
