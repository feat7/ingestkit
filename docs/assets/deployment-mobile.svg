<path d="M175 374L180 380L185 374" class="arrow"/>
<text x="195" y="313" class="small">HTTP</text>
<path d="M180 452V480" class="arrow"/>
<path d="M175 474L180 480L185 474" class="arrow"/>
<text x="195" y="472" class="small">publish</text>
<path d="M180 552V580" class="arrow"/>
<path d="M175 574L180 580L185 574" class="arrow"/>
<text x="195" y="572" class="small">consume</text>
