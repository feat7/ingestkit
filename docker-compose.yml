name: ingestkit-showcase
x-labels: &labels
  io.ingestkit.run: ${INGESTKIT_RUN_ID:-manual}
services:
  postgres:
    image: postgres:18.6-alpine
    labels: *labels
    environment:
      POSTGRES_USER: ingestkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-test-only}
      POSTGRES_DB: ${POSTGRES_DB:-ingestkit_test}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ingestkit -d ${POSTGRES_DB:-ingestkit_test}"]
      interval: 1s
      timeout: 2s
      retries: 40
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    labels: *labels
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --unsafe-bypass-fsync=false
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${INGESTKIT_BROKER_PORT:-19092}
    ports: ["127.0.0.1:${INGESTKIT_BROKER_PORT:-19092}:19092"]
    volumes: ["redpanda_data:/var/lib/redpanda/data"]
    healthcheck:
      test: [CMD, rpk, cluster, info, -X, brokers=localhost:9092]
      interval: 1s
      timeout: 3s
      retries: 40
  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    labels: *labels
    entrypoint: [/bin/sh, -ec]
    command:
      - rpk topic create ingestkit.events --if-not-exists -p 3 -r 1 -c write.caching=false -c retention.ms=${RETENTION_MS:-604800000} -c max.message.bytes=524288 -X brokers=redpanda:9092 && rpk topic create ingestkit.dlq --if-not-exists -p 1 -r 1 -c write.caching=false -c retention.ms=${RETENTION_MS:-604800000} -c max.message.bytes=2097152 -X brokers=redpanda:9092 && rpk topic alter-config ingestkit.events ingestkit.dlq --set write.caching=false -X brokers=redpanda:9092
    depends_on:
      redpanda: {condition: service_healthy}
  migrate:
    image: migrate/migrate:v4.20.1
    labels: *labels
    volumes: ["./migrations/showcase:/migrations:ro"]
    command: ["-path=/migrations", "-database=postgres://ingestkit:${POSTGRES_PASSWORD:-local-test-only}@postgres:5432/${POSTGRES_DB:-ingestkit_test}?sslmode=disable&search_path=public&x-migrations-table=ingestkit_schema_migrations", up]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    labels: *labels
    environment:
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BROKERS: redpanda:9092
      API_KEYS: ${API_KEYS:-{"local-demo-key":"demo"}}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10000}
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      topics: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /api, check]
      interval: 1s
      timeout: 3s
      retries: 40
    stop_grace_period: 12s
  consumer:
    build: {context: ., dockerfile: Dockerfile.consumer}
    labels: *labels
    environment:
      METRICS_ADDR: :8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BROKERS: redpanda:9092
      DATABASE_URL: postgres://ingestkit:${POSTGRES_PASSWORD:-local-test-only}@postgres:5432/${POSTGRES_DB:-ingestkit_test}?sslmode=disable
    ports: ["127.0.0.1:${METRICS_PORT:-8081}:8081"]
    depends_on:
      topics: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /consumer, check]
      interval: 1s
      timeout: 3s
      retries: 40
    stop_grace_period: 12s
volumes:
  postgres_data:
    labels: *labels
  redpanda_data:
    labels: *labels
